name: BMS Doomsday 21 December Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check or test"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - test

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Restore sent-alert marker
        uses: actions/cache/restore@v4
        with:
          path: .bms-alert-sent
          key: bms-doom-dec21-alert-sent-v1

      - name: Skip after successful alert
        id: marker
        shell: bash
        run: |
          if [ "${{ github.event.inputs.mode || 'check' }}" != "test" ] && [ -f .bms-alert-sent ]; then
            echo "21 December alert has already been sent."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.marker.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.marker.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run requested mode
        if: steps.marker.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode || 'check' }}" = "test" ]; then
            python BMS_DOOM_DEC21.py --test
          else
            python BMS_DOOM_DEC21.py --check-one-shot
          fi

      - name: Save sent-alert marker
        if: hashFiles('.bms-alert-sent') != ''
        uses: actions/cache/save@v4
        with:
          path: .bms-alert-sent
          key: bms-doom-dec21-alert-sent-v1
